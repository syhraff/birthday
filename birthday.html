<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    background:url('image/iii.png') center/cover no-repeat;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,182,193,0.25);
    backdrop-filter:blur(5px);
    z-index:0;
  }

  /* floating icons */
  .float-icon{
    position:absolute;
    width:90px;
    opacity:0.8;
    z-index:3;
    animation: floaty 5s ease-in-out infinite;
  }

  @keyframes floaty{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-22px) rotate(4deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }

  /* main text */
  #title1, #title2{
    position:absolute;
    width:100%;
    text-align:center;
    color:#ff2e88;
    font-size:28px;
    font-weight:700;
    top:18%;
    z-index:5;
    transition:0.6s ease;
  }
  #title2{ display:none; }

  /* cake */
  #cake{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%, -50%);
    width:260px;
    cursor:pointer;
    z-index:6;
    transition:0.6s;
  }

  /* split cakes */
  #cakeLeft, #cakeRight{
    position:absolute;
    top:50%;
    width:200px;
    opacity:0;
    transform:translateY(-50%);
    transition:1s ease;
    z-index:6;
  }
  #cakeLeft{ left:50%; transform:translate(-110%, -50%) }
  #cakeRight{ right:50%; transform:translate(110%, -50%) }

  /* gift */
  #gift{
    position:absolute;
    left:50%; top:53%;
    transform:translateX(-50%);
    width:250px;
    display:none;
    cursor:pointer;
    z-index:6;
  }

  /* confetti */
  .confetti{
    position:fixed;
    width:10px;
    height:14px;
    background:var(--c);
    top:-20px;
    animation:fall 5s linear infinite;
    z-index:10;
  }
  @keyframes fall{
    to{ transform:translateY(120vh) rotate(360deg); }
  }

  /* bottom love layer */
  .love-floor{
    position:absolute;
    bottom:-10px;
    width:100%;
    height:120px;
    background:url('images/love.png') repeat-x;
    background-size:90px;
    opacity:0.75;
    z-index:1;
  }

</style>
</head>
<body>

<!-- MANY FLOATERS -->
<img src="image/1-removebg-preview.png"   class="float-icon" style="left:20px; top:20px;">
<img src="image/Untitled_design__1_-removebg-preview.png"    class="float-icon" style="right:20px; bottom:20px;">
<img src="image/hello-kitty-frame-removebg-preview.png"  class="float-icon" style="left:30px; bottom:30px;">
<img src="image/2-removebg-preview.png"   class="float-icon" style="right:25px; top:30px; width:80px;">
<img src="image/1-removebg-preview.png"   class="float-icon" style="left:50%; top:10%; width:70px;">
<img src="image/hello-kitty-frame-removebg-preview.png"  class="float-icon" style="right:10%; bottom:50%; width:70px;">

<h1 id="title1">Kek hari jadi untuk orang tersayang ❤️</h1>
<h1 id="title2">Happy Birthday My Love 🎉</h1>

<img id="cake" src="image/cake_birthday-removebg-preview.png" onclick="splitCake()">

<img id="cakeLeft" src="image/kiri-removebg-preview.png">
<img id="cakeRight" src="image/kanan-removebg-preview.png">

<img id="gift" src="image/box_gift-removebg-preview.png" onclick="goGift()">

<div class="love-floor"></div>

<script>
function splitCake(){
  document.getElementById("cake").style.opacity = 0;

  setTimeout(()=>{
    document.getElementById("cake").style.display = "none";
    document.getElementById("cakeLeft").style.opacity = 1;
    document.getElementById("cakeRight").style.opacity = 1;
    document.getElementById("cakeLeft").style.transform = "translate(-200%, -50%)";
    document.getElementById("cakeRight").style.transform = "translate(200%, -50%)";
    startConfetti();
  },400);

  setTimeout(()=>{
    document.getElementById("title1").style.opacity = 0;
    document.getElementById("cakeLeft").style.opacity = 0;
    document.getElementById("cakeRight").style.opacity = 0;
  },2000);

  setTimeout(()=>{
    document.getElementById("title1").style.display = "none";
    document.getElementById("title2").style.display = "block";
    document.getElementById("gift").style.display = "block";
  },2700);
}

function startConfetti(){
  for(let i=0;i<200;i++){
    let c = document.createElement("div");
    c.classList.add("confetti");
    c.style.left = Math.random()*100+"vw";
    c.style.animationDelay = Math.random()*3+"s";
    c.style.setProperty("--c", randomColor());
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5200);
  }
}

function randomColor(){
  const colors=["#ff2e88","#ff7aa2","#ffc8dd","#ff99cc","#ff5ca8"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function goGift(){
  window.location.href = "gift.html";
}
</script>

</body>
</html>
